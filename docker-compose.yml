name: aibean
services:
  db:
    profiles: ["local-services"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aibean
      # The postgres image refuses an empty password when this service starts.
      # Leave interpolation optional so hosted-only app use needs no local secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: aibean
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["aibean_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibean"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    profiles: ["local-services"]
    image: redis:7-alpine
    ports: ["127.0.0.1:63799:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["aibean_redis:/data"]
  web:
    profiles: ["app"]
    build: .
    ports: ["127.0.0.1:3001:3000"]
    env_file: .env.local
    # Use the deliberately configured .env.local target. Do not silently
    # replace the hosted database with the separate local PostgreSQL service.
volumes:
  aibean_pg:
  aibean_redis:
